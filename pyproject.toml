[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-personal-tutor"
version = "0.1.0"
description = "応用情報技術者試験向けのAI個別指導Webアプリ"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "openai>=1.66,<3.0",
    "python-dotenv>=1.0,<2.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*", "ubuntu_agent*"]
